name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta todos los lunes y jueves a las 00:00 UTC (Evita la pausa de 7 días)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Permite que tú lo actives manualmente cuando quieras

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request to Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
